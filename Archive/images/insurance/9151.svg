    <text x="372" y="298" text-anchor="middle">a</text>
    <text x="520" y="298" text-anchor="middle">n</text>
    <text x="662" y="298" text-anchor="middle">v</text>
  </g>

  <!-- Strapline -->
  <g font-weight="700" font-size="60">
